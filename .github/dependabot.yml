# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet reached 1,461 open PRs across 176
# repos, none of which had any CI signal because the only workflow fired on
# push to main.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18
# backlog was landed by hand, 109 bumps had to be held back and they were
# overwhelmingly majors -- @noble v2 dropped export subpaths, TypeScript 7 and
# vitest 4 broke a smaller set. Grouping a breaking major together with the
# safe bumps makes the whole PR unmergeable, which is the hand-unpicking this
# exists to prevent.
#
# github-actions majors ARE grouped: checkout v4->v7, setup-node v4->v7 and the
# Pages v5/v6 jumps were verified green across all 176 repos on 2026-08-18.
#
# Both groups auto-merge once this lab's own gate passes on the PR -- see the
# dependabot-auto-merge job in .github/workflows/deploy.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
